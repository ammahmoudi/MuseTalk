[project]
name = "musetalk"
version = "0.1.0"
description = "MuseTalk - Real-time Lip Sync Generation with Streaming API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML and Deep Learning  
    "numpy==1.23.5",
    "torch>=2.0.1",
    "torchvision>=0.15.2", 
    "torchaudio>=2.0.2",
    
    # MuseTalk Core
    "diffusers>=0.30.2",
    "accelerate>=0.28.0", 
    "transformers>=4.39.2",
    "huggingface_hub>=0.30.2",
    "einops>=0.8.1",
    "omegaconf",
    
    # Audio Processing
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "ffmpeg-python",
    
    # Image/Video Processing
    "opencv-python>=4.8.0",
    "decord>=0.6.0",
    "imageio[ffmpeg]",
    "moviepy",
    "pillow>=10.1.0",
    
    # Web API Framework  
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "aiohttp>=3.12.0",
    "aiofiles>=23.2.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.2",
    
    # Utilities
    "gradio>=5.24.0",
    "tqdm>=4.66.1",
    "click>=8.1.7",
    "requests",
    "gdown",
    "python-dotenv>=1.0.0",
    "scipy>=1.11.4",
]
