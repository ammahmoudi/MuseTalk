# 🚀 MuseTalk Legendary API Docker Compose
version: '3.8'

services:
  musetalk-api:
    build: 
      context: .
      dockerfile: api/Dockerfile
    container_name: musetalk-legendary-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro  # Read-only models
      - ./data:/app/data:ro      # Read-only test data
      - ./temp:/app/temp         # Temporary files
      - ./results:/app/results   # Generated results
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONPATH=/app
      - TORCH_CUDA_ARCH_LIST="6.0;6.1;7.0;7.5;8.0;8.6"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Redis for caching (future enhancement)
  redis:
    image: redis:7-alpine
    container_name: musetalk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles: ["with-cache"]

  # Optional: Nginx reverse proxy (production)
  nginx:
    image: nginx:alpine
    container_name: musetalk-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - musetalk-api
    restart: unless-stopped
    profiles: ["production"]

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: musetalk-network